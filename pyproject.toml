[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mindtune-console"
version = "0.1.0"
description = "MindTune Lab console workspace"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "typing-extensions>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9",
    "pytest-cov>=4.1,<5",
    "black>=24.0,<25",
    "ruff>=0.4.0,<0.5",
    "mypy>=1.10,<1.11",
    "hypothesis>=6.100,<7",
]
hebrew = [
    "phonikud>=0.4.1,<0.5; python_version<'3.13'",
]

[tool.setuptools.packages.find]
where = ["packages/mpe/src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"mantra/phase1/timeline.py" = ["C901"]
"mantra/phase1/playback.py" = ["C901"]
"mantra/phase1/spec.py" = ["C901"]
"mantra/phase1/assembly.py" = ["C901"]
"scripts/build_citizen_cafe_all_courses.py" = ["C901", "B905"]
"scripts/consolidate_citizen_cafe_corpus.py" = ["C901"]
"scripts/evaluate_phonikud.py" = ["F841"]
"tests/test_azure_speech.py" = ["E402"]
"tests/test_behavioral_event_store.py" = ["E402"]
"tests/test_hebrew_recovery.py" = ["E402"]
"tests/test_help_profiler.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["mpe", "mantra"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = "numpy.*"
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "numpy"
follow_imports = "skip"
