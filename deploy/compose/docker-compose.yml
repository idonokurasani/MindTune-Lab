services:
  clm-api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.clm
    image: mindtune/clm:0.9.0
    container_name: mindtune-clm
    ports:
      - "127.0.0.1:8005:8005"
    env_file:
      - .env
    environment:
      - CLM09_DEPLOYMENT_MODE=container
    volumes:
      - clm-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/api/v1/health/live')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  clm-data:
