<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindTune Lab - Blue/Purple Translation Patch</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #071018;
      --panel: #101923;
      --line: #284050;
      --cyan: #35e7f2;
      --ink: #e9f6ff;
      --muted: #9bb1bd;
      --blue: #6aa7ff;
      --purple: #b879ff;
      --green: #69f0ae;
      --red: #ff747a;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    body { margin: 0; background: var(--bg); color: var(--ink); }
    header {
      position: sticky; top: 0; z-index: 2;
      background: linear-gradient(180deg, rgba(7,16,24,.98), rgba(7,16,24,.92));
      border-bottom: 1px solid var(--line);
      padding: 18px 22px;
    }
    h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: 0; }
    .summary { color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
    .controls { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
    button, select, input[type="search"] {
      border: 1px solid var(--line); background: #0b141d; color: var(--ink);
      border-radius: 8px; padding: 9px 11px; font: inherit;
    }
    button.primary { border-color: rgba(53,231,242,.6); background: rgba(53,231,242,.14); }
    main { padding: 18px 22px 80px; }
    .row {
      display: grid; grid-template-columns: 86px minmax(190px, .8fr) repeat(3, minmax(220px, 1fr)) 250px;
      gap: 10px; align-items: stretch;
      border: 1px solid var(--line); background: rgba(16,25,35,.88);
      border-radius: 10px; padding: 10px; margin-bottom: 10px;
    }
    .deck { font-weight: 800; }
    .deck.Blue { color: var(--blue); }
    .deck.Purple { color: var(--purple); }
    .cell { border: 1px solid rgba(132,176,198,.2); border-radius: 8px; padding: 10px; background: rgba(5,11,17,.52); }
    .label { color: var(--muted); font-size: 12px; text-transform: uppercase; font-weight: 800; margin-bottom: 8px; }
    .he { direction: rtl; unicode-bidi: plaintext; font-size: 24px; font-weight: 800; line-height: 1.25; color: var(--cyan); }
    .en { margin-top: 10px; color: #d3e3ec; line-height: 1.35; }
    .it { line-height: 1.38; font-size: 15px; }
    .flags { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .choice { display: grid; gap: 8px; }
    label.option { display: flex; gap: 8px; align-items: flex-start; line-height: 1.2; }
    textarea { width: 100%; min-height: 58px; resize: vertical; border-radius: 8px; border: 1px solid var(--line); background: #061019; color: var(--ink); padding: 8px; font: inherit; box-sizing: border-box; }
    .rec { color: var(--green); font-weight: 800; }
    .warn { color: #ffd285; }
    .bad { color: var(--red); }
    .hidden { display: none; }
    @media (max-width: 1320px) {
      .row { grid-template-columns: 80px 1fr; }
      .cell, .choice { grid-column: span 1; }
    }
  </style>
</head>
<body>
<header>
  <h1>Blue/Purple Translation Patch</h1>
  <div class="summary">
    <span id="count"></span>
    <span>Scelta riga per riga: attuale / Docker safe / Docker finale / custom.</span>
    <span class="warn">Non modifica il database: esporta solo le tue scelte.</span>
  </div>
  <div class="controls">
    <select id="deckFilter">
      <option value="">Blue + Purple</option>
      <option value="Blue">Solo Blue</option>
      <option value="Purple">Solo Purple</option>
    </select>
    <select id="choiceFilter">
      <option value="">Tutte</option>
      <option value="blank">Non scelte</option>
      <option value="changed">Con proposta diversa</option>
      <option value="semantic">Con semantic_review</option>
    </select>
    <input id="search" type="search" placeholder="cerca ebraico / inglese / italiano">
    <button id="applyRecommended">Usa consigli dove sicuri</button>
    <button id="exportCsv" class="primary">Esporta scelte CSV</button>
  </div>
</header>
<main id="rows"></main>

const choices = new Map();
const custom = new Map();
const notes = new Map();

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[ch]));
}

function rowHasSemantic(row) {
  return [row.docker_safe_flags, row.docker_final_flags, row.current_flags].some(v => String(v || "").includes("semantic_review"));
}

function isChanged(row) {
  return row.current_back !== row.docker_safe_back || (row.docker_final_back && row.current_back !== row.docker_final_back);
}

function visibleRows() {
  const deck = document.querySelector("#deckFilter").value;
  const cf = document.querySelector("#choiceFilter").value;
  const q = document.querySelector("#search").value.trim().toLowerCase();
  return DATA.filter(row => {
    if (deck && row.deck !== deck) return false;
    if (cf === "blank" && choices.get(row.patch_id)) return false;
    if (cf === "changed" && !isChanged(row)) return false;
    if (cf === "semantic" && !rowHasSemantic(row)) return false;
    if (q) {
      const hay = [row.front, row.front_original, row.back_original, row.current_back, row.docker_safe_back, row.docker_final_back].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function option(row, value, label, extra = "") {
  const checked = choices.get(row.patch_id) === value ? "checked" : "";
  const rec = row.recommended_choice === value ? ' <span class="rec">consigliata</span>' : "";
  return `<label class="option"><input type="radio" name="choice_${row.patch_id}" value="${value}" ${checked}> <span>${label}${rec}${extra}</span></label>`;
}

      <div class="cell">
        <div class="label">Docker safe</div>

        <div class="flags">${esc(row.docker_safe_flags || "flags vuoto")}</div>

      <div class="cell">
        <div class="label">Docker finale</div>

      </div>
      <div class="choice">
        <div class="label">Scelta</div>

        ${option(row, "docker_safe", "usa Docker safe")}
        ${option(row, "docker_final", "usa Docker finale")}
        ${option(row, "custom", "custom")}
        ${option(row, "skip", "salta / decido dopo")}
        <textarea data-custom="${row.patch_id}" placeholder="custom_back">${esc(custom.get(row.patch_id) || "")}</textarea>
        <textarea data-notes="${row.patch_id}" placeholder="note">${esc(notes.get(row.patch_id) || "")}</textarea>
      </div>
    </section>
  `).join("");
  document.querySelectorAll("input[type=radio]").forEach(input => {
    input.addEventListener("change", () => {
      choices.set(input.closest(".row").dataset.id, input.value);
    });
  });
  document.querySelectorAll("[data-custom]").forEach(area => {
    area.addEventListener("input", () => custom.set(area.dataset.custom, area.value));
  });
  document.querySelectorAll("[data-notes]").forEach(area => {
    area.addEventListener("input", () => notes.set(area.dataset.notes, area.value));
  });
}

function csvEscape(value) {
  const s = String(value ?? "");
  return /[",\n\r]/.test(s) ? `"${s.replaceAll('"', '""')}"` : s;
}

function exportCsv() {
  const fields = ["patch_id","choice","custom_back","custom_flags","notes"];
  const lines = [fields.join(",")];
  for (const row of DATA) {
    const choice = choices.get(row.patch_id) || "";
    const customBack = custom.get(row.patch_id) || "";
    const note = notes.get(row.patch_id) || "";
    lines.push([row.patch_id, choice, customBack, "", note].map(csvEscape).join(","));
  }
  const blob = new Blob(["\ufeff" + lines.join("\n")], {type: "text/csv;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "blue_purple_translation_patch_choices.csv";
  a.click();
  URL.revokeObjectURL(url);
}

document.querySelector("#deckFilter").addEventListener("change", render);
document.querySelector("#choiceFilter").addEventListener("change", render);
document.querySelector("#search").addEventListener("input", render);
document.querySelector("#exportCsv").addEventListener("click", exportCsv);
document.querySelector("#applyRecommended").addEventListener("click", () => {
  for (const row of DATA) {
    if (row.recommended_choice && row.recommended_choice !== "current") choices.set(row.patch_id, row.recommended_choice);
  }
  render();
});
render();
</script>
</body>
</html>
