services:
  mpe-persistence-test:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
      MPE_EVENT_STORE_PATH: /tmp/mpe-test-events.db
    command: >
      sh -c "python -m unittest discover -s packages/mpe/tests/persistence -p 'test_*.py' -v"
